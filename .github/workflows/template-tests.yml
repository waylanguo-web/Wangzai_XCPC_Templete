name: template-tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  template-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show tool versions
        run: |
          python --version
          g++ --version

      - name: Run template tests
        run: python tools/template_tests/run.py --all

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-test-results
          path: tools/template_tests/.generated/results.json
          if-no-files-found: ignore
